[package]
name = "crashpack"
version = "0.1.0"
edition = "2021"
description = "A local-first, privacy-preserving diagnostic support bundle CLI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.37"
thiserror = "2.0"
zip = { version = "7.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.15"
