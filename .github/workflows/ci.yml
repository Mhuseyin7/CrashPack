name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Known-secret bundle regression
        shell: bash
        run: |
          bearer="super-secret-bearer-value-987654321"
          email="alice""@example.com"
          aws_key="AKIA""AAAAAAAAAAAAAAAA"
          jwt="eyJhbGciOiJIUzI1NiJ9"".""eyJzdWIiOiIxMjM0NTY3ODkwIn0"".""fixture-signature"
          query_token="unshareable-query-token-123"
          private_material="private-key-material-never-share"
          mkdir -p /tmp/crashpack-source
          cat > /tmp/crashpack-source/crashpack.yml <<'EOF'
          version: 1
          application: { name: FixtureApp, version: test }
          collect:
            system: false
            runtime: false
            files: [{ path: known-secrets.log, max_bytes: 100000 }]
          redaction: { privacy_level: STRICT, emails: true, ip_addresses: true, paths: true }
          limits: { max_bundle_bytes: 1000000, command_timeout_secs: 2 }
          EOF
          cat > /tmp/crashpack-source/known-secrets.log <<EOF
          Authorization: Bearer $bearer
          customer=$email remote=203.0.113.42
          jwt=$jwt
          aws=$aws_key
          url=https://service.example/debug?token=$query_token
          -----BEGIN PRIVATE KEY-----
          $private_material
          -----END PRIVATE KEY-----
          EOF
          cargo run --locked -- collect --config /tmp/crashpack-source/crashpack.yml --output /tmp/crashpack-fixture
          bundle=$(find /tmp/crashpack-fixture -name '*.zip' -print -quit)
          ! unzip -p "$bundle" | grep -E "$bearer|$email|$aws_key|$private_material|$query_token"
